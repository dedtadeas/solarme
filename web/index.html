<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolarMe — kde uvidíte zatmění Slunce</title>
<meta name="description" content="Metrová mapa toho, kde bude nízké zatmělé slunce 12. srpna 2026 vidět — Praha, Brno, Ostrava a další — a kde ho zakryjí domy, stromy a kopce.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="./style.css">

<!-- Sharing: without these, a pasted link renders as a bare URL with no image,
     which is most of the difference between a link people tap and one they
     scroll past. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://solarme.cz/">
<meta property="og:site_name" content="SolarMe">
<meta property="og:locale" content="cs_CZ">
<meta property="og:title" content="Kde uvidíte zatmění Slunce — ulici po ulici">
<meta property="og:description" content="Metrová mapa pro 12. srpna 2026. Slunce bude jen 1–9° nad obzorem, takže záleží na každé ulici — mapa počítá, co ho zakryje: domy, stromy, kopce.">
<meta property="og:image" content="https://solarme.cz/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Mapa obarvená podle toho, odkud bude vidět zatmělé slunce — světlá místa ho uvidí, tmavá ho mají zakryté">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Kde uvidíte zatmění Slunce — ulici po ulici">
<meta name="twitter:description" content="Metrová mapa pro 12. srpna 2026. Slunce bude jen 1–9° nad obzorem, takže záleží na každé ulici.">
<meta name="twitter:image" content="https://solarme.cz/preview.jpg">
</head>
<body>

<div id="map"></div>

<header class="panel panel--title">
  <div class="title-row">
    <h1>SolarMe</h1>
    <div class="seg seg--lang" role="group" aria-label="Jazyk / Language">
      <button type="button" data-lang="cs" class="on">CZ</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
  <p class="sub"><span data-i18n="sub"></span><br><span class="when" data-i18n="when"></span></p>

  <div class="search" role="search">
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           data-i18n-placeholder="searchPlaceholder" aria-label="Search for a place"
           aria-controls="q-results" aria-expanded="false">
    <button id="q-clear" type="button" hidden aria-label="Clear">×</button>
    <ul id="q-results" class="search-results" role="listbox" hidden></ul>
    <p id="q-note" class="search-note" hidden></p>
  </div>
</header>

<section class="panel panel--legend" id="legend">
  <div class="legend-head">
    <span data-i18n="legendHead"></span>
    <div class="legend-head-btns">
      <button id="legend-toggle" type="button" aria-expanded="true" aria-controls="legend-body"
              data-i18n-title="controlsBtn" aria-label="Map settings">▾</button>
      <button id="guide-open" data-i18n-title="guideBtn" aria-label="Guide">?</button>
    </div>
  </div>

  <div class="ramp" role="img"></div>
  <div class="ramp-labels">
    <span data-i18n="rampNever"></span><span data-i18n="rampHalf"></span><span data-i18n="rampWhole"></span>
  </div>

  <!-- The ramp above IS the legend and always shows. Everything below is
       settings, and on a phone it starts collapsed so the map keeps the screen. -->
  <div class="legend-body" id="legend-body">

  <label class="slider">
    <span data-i18n="opacity"></span>
    <input type="range" id="opacity" min="0" max="100" value="90">
  </label>

  <div class="basemap" role="group">
    <span data-i18n="show"></span>
    <div class="seg">
      <button type="button" data-layer="fraction" class="on" data-i18n="layerFraction" data-i18n-title="layerFractionTip"></button>
      <button type="button" data-layer="max" id="max-toggle" data-i18n="layerMax" data-i18n-title="layerMaxTip"></button>
    </div>
  </div>

  <div class="basemap" role="group">
    <span data-i18n="basemap"></span>
    <div class="seg">
      <button type="button" data-base="dark" class="on" data-i18n="baseDark"></button>
      <button type="button" data-base="satellite" data-i18n="baseSat"></button>
    </div>
  </div>

  <div class="basemap" role="group">
    <span><span data-i18n="terrain"></span> <em class="beta">test</em></span>
    <div class="seg">
      <button type="button" id="terrain-toggle" data-i18n-title="terrainTip"></button>
    </div>
  </div>

  <label class="slider" id="terrain-ex-wrap" hidden>
    <span><span data-i18n="exaggeration"></span> <span id="terrain-ex-value">2.5×</span></span>
    <input type="range" id="terrain-ex" min="10" max="45" value="25">
  </label>

  <p class="note" data-i18n="coverageNote"></p>
  <p class="note" data-i18n="note1"></p>
  <p class="note" data-i18n="note2"></p>
  </div>
</section>

<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <h2>SolarMe</h2>
    <p data-i18n="gateDesc"></p>
    <p class="warn" data-i18n="warn"></p>
    <button id="gate-ok" data-i18n="gateOk"></button>
    <p class="gate-fineprint">
      <span data-i18n="fineprint"></span>
      <a href="mailto:bordelveskrini@gmail.com?subject=SolarMe%20%E2%80%94%20chyba%20v%20map%C4%9B"
         data-i18n="reportLink"></a>
    </p>
    <!-- Below the safety button on purpose: the acknowledgement above is about
         retinal burns and nothing may compete with it for attention. -->
    <p class="gate-support" id="gate-support" hidden>
      <span data-i18n="gateSupport"></span>
      <a id="gate-kofi" href="#" target="_blank" rel="noopener" data-i18n="gateSupportLink"></a>
    </p>
  </div>
</div>

<div class="hint" id="hint" hidden>
  <p id="hint-text"></p>
  <div class="hint-foot">
    <span id="hint-step"></span>
    <div>
      <button id="hint-skip" class="ghost" data-i18n="skip"></button>
      <button id="hint-next"></button>
    </div>
  </div>
</div>

<footer class="panel panel--foot">
  <span>Podkladová data © <a href="https://geoportal.cuzk.cz" target="_blank" rel="noopener">ČÚZK</a>, CC BY 4.0</span>
  <span class="dot">·</span>
  <a href="https://github.com/dedtadeas/solarme" target="_blank" rel="noopener" data-i18n="source"></a>
  <a href="mailto:bordelveskrini@gmail.com?subject=SolarMe%20%E2%80%94%20chyba%20v%20map%C4%9B" data-i18n="report"></a>
  <a id="kofi" href="#" target="_blank" rel="noopener" hidden data-i18n="support"></a>
</footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<!-- Where the .pmtiles archives live. Not in the repo: a region pair is ~90 MB
     and 71 regions is ~6 GB. Served through CloudFront rather than straight from
     S3 — same per-GB rate, but a 1 TB/month free tier instead of 100 GB, and the
     edge caches a whole archive on first touch so later byte ranges never reach
     the origin (verified: a second, different range returns x-cache: Hit).
     Trailing slash required. Leave empty for local dev via web/serve.py. -->
<script>window.TILE_BASE = "https://d20dgz2znvrjzl.cloudfront.net/tiles/";</script>
<script src="./app.js"></script>
</body>
</html>
