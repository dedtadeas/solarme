name: Deploy map to GitHub Pages

# The site is fully static: Pages serves the ~35 KB shell (HTML + JS + CSS) and
# the PMTiles archives are read from S3 over HTTP range requests. Keeping the
# tiles out of the repo is what lets coverage grow past Prague — national is
# ~17 GB, and the archives no longer have to fit under 100 MB each.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tiles will actually be reachable
        run: |
          # The invariant is not "TILE_BASE must be set" — it is "the archives
          # must be somewhere". Either they ship in the repo and TILE_BASE is
          # empty, or TILE_BASE points at a CDN and the repo carries none. An
          # earlier version of this check asserted only the second arrangement
          # and failed the first deploy after the archives moved back in.
          if grep -q 'window.TILE_BASE = ""' web/index.html; then
            n=$(ls web/*.pmtiles 2>/dev/null | wc -l)
            if [ "$n" -eq 0 ]; then
              echo "::error::TILE_BASE is empty and web/ holds no .pmtiles — the map would be blank."
              exit 1
            fi
            echo "serving $n archives from the repo"
            for f in web/*.pmtiles; do
              mb=$(( $(stat -c%s "$f") / 1048576 ))
              echo "  $(basename "$f"): ${mb} MB"
              if [ "$mb" -gt 100 ]; then
                echo "::error::$f is ${mb} MB — over GitHub's 100 MB per-file limit."
                exit 1
              fi
            done
          else
            echo "TILE_BASE points off-repo; archives are not expected here"
          fi

      - name: Version the assets against the browser cache
        run: |
          # Pages serves everything with max-age=600, so a returning visitor can
          # sit on a 10-minute-old app.js or coverage.geojson — and those two
          # carry the region list, which changes every time a tile lands. The
          # HTML expires on its own within 10 minutes; versioning what it points
          # at means the moment it does, every asset is fetched fresh.
          V=${GITHUB_SHA::7}
          sed -i "s|\./app\.js|./app.js?v=$V|g; s|\./style\.css|./style.css?v=$V|g" web/index.html
          sed -i "s|\"\./coverage\.geojson\"|\"./coverage.geojson?v=$V\"|g" web/app.js
          echo "assets versioned as v=$V"
          grep -o 'app\.js?v=[a-f0-9]*' web/index.html || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
